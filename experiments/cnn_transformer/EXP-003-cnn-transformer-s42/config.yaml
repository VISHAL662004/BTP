experiment:
  name: EXP-003-cnn-transformer-s42
  seed: 42
paths:
  data_root: data
  results_root: results
  checkpoints_root: checkpoints
  logs_root: logs
device:
  preferred: mps
  fallback: cpu
data:
  input_slices: 5
  slice_stride: 1
  patch_size: 64
  cache_dir: data/processed
  channels:
  - 0
  - 1
  - 2
  - 3
  - 4
  pos_repeat: 10
  augment: dihedral
training:
  batch_size: 256
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  selection_metric: val_cpm
loss:
  lambda_cls: 1.0
  lambda_loc: 1.0
  focal_alpha: 0.25
  focal_gamma: 2.0
pruning:
  enabled: false
model:
  attention: false
  backbone: simple_cnn
  in_channels: 5
  widths:
  - 16
  - 32
  - 64
  - 128
  head_hidden: 64
  dropout: 0.2
  context: transformer
  transformer:
    tokens_hw:
    - 4
    - 4
    depth: 2
    heads: 4
    mlp_ratio: 2.0
    dropout: 0.1
evaluation:
  annotations: data/annotations.csv
  excluded: data/annotations/annotations_excluded.csv
  splits_dir: data/splits
  max_marks_per_scan: 100
