experiment:
  name: EXP-005-convctrl-structured-L4
  seed: 46
paths:
  data_root: data
  results_root: results
  checkpoints_root: checkpoints
  logs_root: logs
device:
  preferred: mps
  fallback: cpu
data:
  input_slices: 5
  slice_stride: 1
  patch_size: 64
  cache_dir: data/processed
  channels:
  - 0
  - 1
  - 2
  - 3
  - 4
  pos_repeat: 10
  augment: dihedral
training:
  batch_size: 256
  epochs: 4
  learning_rate: 0.0003
  weight_decay: 0.0001
  scheduler: cosine
  selection_metric: val_cpm
loss:
  lambda_cls: 1.0
  lambda_loc: 1.0
  focal_alpha: 0.25
  focal_gamma: 2.0
pruning:
  enabled: false
model:
  attention: false
  backbone: simple_cnn
  in_channels: 5
  widths:
  - 5
  - 10
  - 19
  - 128
  head_hidden: 64
  dropout: 0.2
  context: conv_control
  conv_control:
    depth: 2
  mid_widths:
  - 5
  - 10
  - 19
  - 38
evaluation:
  annotations: data/annotations.csv
  excluded: data/annotations/annotations_excluded.csv
  splits_dir: data/splits
  max_marks_per_scan: 100
